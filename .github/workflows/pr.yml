name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # Fork: pinned to the release commit this queue is based on (v2026.1106.0,
    # d69631b01), so the trusted workflow matches this tree's scripts. Upstream
    # master's pr-trusted.yml moves ahead of the release and can call scripts this
    # tree does not have. Move the pin at the next rebase onto a release.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@d69631b01b9c658f80bf8bed389863dce82643e1
